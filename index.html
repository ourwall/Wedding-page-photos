<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wedding photo wall</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="hero">
    
  <div class="flip-container">
  <div class="flip-text">
    <span>Wedding Day💍 </span>
    <span>celebration✨️ </span>
  </div>
  </div>
    <a href="mailto:narwhalweddingphotos@gmail.com?subject=Wedding Photo Wall Enquiry" class="contact-btn">Contact us</a>
<h2>Adam & eve's <br> Weddingday 💍 </h2>
  </header>
  <div class="photo-row">
  <div class="hero-polaroid"><img src="Weddingwall5.jpg" alt="Wedding photo"></div>
  <div class="hero-polaroid"><img src="Weddingwall4.jpg" alt="Wedding photo"></div>
  <div class="hero-polaroid"><img src="Weddingwall3.jpg" alt="Wedding photo"></div>
  </div>

    </div> <div class="demo-upload">
  <input type="file" accept="image/*" capture="environment" id="demoPhotoInput" style="display:none;">
  <button onclick="document.getElementById('demoPhotoInput').click()" class="demo-btn">
    📸 Try it — take a photo
  </button>
  <div id="demoPolaroid"></div>
    </div>
  </section>

  <section class="cta">
    <p>
      personalised with your names, colours, background and a printed QRcode for every table.
    </p>

    </a>
  </section> </section>

    <footer>
      <p>&copy; 2026 wedding photo wall</p>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('demoPhotoInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
          const container = document.getElementById('demoPolaroid');
          container.innerHTML = `
            <div class="hero-polaroid demo-result spin-land">
              <img src="${event.target.result}" alt="Your demo photo">
            </div>
          `;
        };
        reader.readAsDataURL(file);
      });
    });
    </script>
  </body>
</html>
